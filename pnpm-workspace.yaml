# TypeDoc reads the TypeScript compiler API off the `typescript` main entry, which typescript@7
# no longer exposes (it only ships `./unstable/*`), and no TypeDoc release accepts a peer above
# 6.0.x. pnpm resolves peers from the importer, so the only way to hand TypeDoc an older
# TypeScript is to give it an importer of its own. This package is that importer; nothing else
# depends on it, and the client itself still builds on 7.
# `.` has to stay listed: declaring `packages` at all replaces the implicit root-only default, and
# changesets resolves release targets through the workspace globs. Without it, `changeset version`
# fails with "Found changeset ... for package @sanity/client which is not in the workspace".
packages:
  - .
  - tools/typedoc
# Dependencies allowed to run install scripts. pnpm blocks these by default.
# - esbuild: links its platform binary, pulled in transitively by vitest and next
# - sharp: next's image optimizer, pulled in by the next type tests
# - workerd: unpacks the Cloudflare Workers runtime binary used by the workerd test suite
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# pnpm holds back releases younger than its minimum release age. Entries here have been
# reviewed and are allowed through.
minimumReleaseAgeExclude:
  - eventsource@5.0.0
  - '@sanity/parse-package-json@2.3.1'
  - '@sanity/pkg-utils@12.1.2'
  - '@sanity/tsdown-config@0.24.1'
  - '@sanity/vanilla-extract-integration@0.1.12'
  - '@sanity/vanilla-extract-rolldown-plugin@0.4.1'
  - '@sanity/vanilla-extract-tsdown-plugin@0.3.1'
