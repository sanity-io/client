name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main, v7]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree.
      # `--mode virtual` reads the lockfile through arborist, which only
      # understands package-lock.json, so use `--mode actual` and walk the
      # installed tree instead. `--mode ideal` would ignore `--no-dev` and
      # still surface engines conflicts from dev-only deps (e.g. vitest).
      - run: pnpm exec ls-engines --mode actual --no-dev
      - run: pnpm run prepublishOnly
      - run: pnpm run lint --report-unused-disable-directives
      - uses: actions/upload-artifact@v7
        name: Cache build output
        with:
          retention-days: 1
          name: build-output-${{ github.run_id }}
          path: |
            dist/

  coverage:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Test and report coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run coverage
      - uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        if: always()

  test:
    needs: [build, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the testing suite on every supported Node.js version, on ubuntu since
        # it's the fastest CI runner (matches get-it):
        #   22.12.0 - the minimum supported version (must match `engines.node`)
        #   24      - the active LTS release
        #   26      - the latest/current release
        os: [ubuntu-latest]
        node: ['22.12.0', '24', '26']
        # Additionally verify the active LTS release on the other major operating systems.
        include:
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # pnpm 11 requires Node >= 22.13, but `engines.node` is >= 22.12 and this matrix
      # deliberately tests that floor. Install under a Node that pnpm can run on, then
      # switch to the matrix version and run the suite without going through pnpm. What
      # we are testing is that the library works on the minimum Node, not that pnpm does.
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree.
      # `--mode virtual` reads the lockfile through arborist, which only
      # understands package-lock.json, so use `--mode actual` and walk the
      # installed tree instead. `--mode ideal` would ignore `--no-dev` and
      # still surface engines conflicts from dev-only deps (e.g. vitest).
      - run: pnpm exec ls-engines --mode actual --no-dev
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests on Node ${{ matrix.node }}
        run: npx vitest run

  vercel-edge:
    # No `needs: [build]`: this job resolves `@sanity/client` through `sourceAlias`
    # (see `vitest.vercel-edge.config.ts`), so it never touches `dist/` and gains
    # nothing from waiting on, or restoring the artifact from, the `build` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:vercel-edge

  # KNOWN, DELIBERATE FAILURE - READ BEFORE TOUCHING `continue-on-error` BELOW.
  #
  # 6 tests in `test/live.test.ts` fail here: workerd's native `MessageEvent` silently
  # drops the `lastEventId` member of its constructor init dict. The HTML Living
  # Standard's `MessageEventInit` includes `lastEventId`, and every other environment
  # this suite runs in (Node, happy-dom, real browsers, vercel-edge, Bun, Deno) honours
  # it; bare Cloudflare Workers does not. `src/data/eventsource.ts` reads
  # `message.lastEventId` to populate the `id` of every `ServerSentEvent`, so on workerd
  # that id silently arrives empty. Confirmed independently with a throwaway
  # `new MessageEvent('message', {lastEventId: '1'})` probe - this is a real shipping
  # bug in workerd, not a gap in this test harness.
  #
  # This failure is expected and deliberate: the fix lands in the `eventsource` package
  # (which Sanity owns), plus a filing upstream against workerd, rather than a
  # workaround here. `continue-on-error: true` exists ONLY so this one known-red job
  # doesn't turn into an indefinitely-failing required check that blocks every unrelated
  # PR in the repo. Do not skip this job, do not exclude these tests, and do not weaken
  # their assertions to make it pass.
  #
  # REMOVE `continue-on-error: true` the moment the `eventsource` fix ships and this job
  # goes green again.
  workerd-runtime:
    # No `needs: [build]`: see the comment on `vercel-edge` above - same reasoning,
    # `vitest.workerd.config.ts` also resolves through `sourceAlias`.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workerd

  browser-runtime:
    # No `needs: [build]`: see the comment on `vercel-edge` above - same reasoning,
    # `vitest.browser.config.ts` also resolves through `sourceAlias`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser -- --coverage

  test-happy-dom:
    # No `needs: [build]`: `vitest.happy-dom.config.ts` resolves through `sourceAlias`,
    # same reasoning as `vercel-edge` above.
    name: Test Happy DOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:happy-dom

  test-react-server:
    # No `needs: [build]`: `vitest.react-server.config.ts` resolves through
    # `sourceAlias`, same reasoning as `vercel-edge` above.
    name: Test React Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:react-server

  deno-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # This job needs a full install: `deno test` type-checks the suite and resolves
      # `@types/node`, which is a devDependency. npm's flat node_modules happened to
      # expose it even under `--omit=dev`; pnpm's isolated layout does not.
      #
      # This job (like `bun-runtime` below) now runs the full suite rather than a
      # two-line smoke file, and the full suite needs devDependencies (vitest itself
      # included), so it can no longer install with `--prod` to catch a devDependency
      # leaking into a published entry point either. That guard now lives in
      # `test/exports.test.ts` and `test/packaging/` (entry-point resolution) and in
      # `knip` (dependency classification) instead of in this job's install step.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm run test:deno

  bun-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # This job runs the full suite (`pnpm run test:bun`) rather than the old
      # two-line smoke file, so it needs devDependencies (vitest itself included) and
      # can no longer install with `--prod --ignore-scripts` to catch a devDependency
      # leaking into a published entry point. That guard now lives in
      # `test/exports.test.ts` and `test/packaging/` (entry-point resolution) and in
      # `knip` (dependency classification) instead of in this job's install step.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - uses: antongolub/action-setup-bun@f0b9f339a7ce9ba1174a58484e4dc9bbd6f7b133 # v1
      - run: pnpm run test:bun

  # Repurposed from the former `node-runtimes` placeholder (test-suite-cleanup Task 13):
  # that job's `runtimes/node` tree is gone (Task 12), and the CJS interop guard it ran
  # now lives at `test/packaging/cjs-interop.test.ts`, alongside the `dist/` graph guard
  # (`test/packaging/distGraph.test.ts`). Both need a real build, not `dist/` aliased to
  # source, so this job builds fresh rather than restoring the `build` job's artifact.
  test-packaging:
    name: Test Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:packaging

  next-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:next
