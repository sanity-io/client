name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main, v7]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: 'Build & lint: Node.js LTS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree.
      # `--mode virtual` reads the lockfile through arborist, which only
      # understands package-lock.json, so use `--mode actual` and walk the
      # installed tree instead. `--mode ideal` would ignore `--no-dev` and
      # still surface engines conflicts from dev-only deps (e.g. vitest).
      - run: pnpm exec ls-engines --mode actual --no-dev
      - run: pnpm run prepublishOnly
      - run: pnpm run lint --report-unused-disable-directives
      # src/context/types.gen.ts must match the checked-in spec it was generated
      # from. Hermetic: regenerates from src/context/openapi.json, never the network.
      - name: Check generated Context types are in sync
        run: |
          pnpm run generate:context
          git diff --exit-code src/context
      - uses: actions/upload-artifact@v7
        name: Cache build output
        with:
          retention-days: 1
          name: build-output-${{ github.run_id }}
          path: |
            dist/

  coverage:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: 'Test: Node.js LTS w/coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run coverage
      - uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        if: always()

  test:
    name: 'Test: Node.js ${{ matrix.node }}, ${{ matrix.platform }}'
    needs: [build, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the testing suite on every supported Node.js version, on ubuntu since
        # it's the fastest CI runner (matches get-it):
        #   22.12.0 - the minimum supported version (must match `engines.node`)
        #   24      - the active LTS release
        #   26      - the latest/current release
        include:
          - os: ubuntu-latest
            platform: Ubuntu
            node: '22.12.0'
          - os: ubuntu-latest
            platform: Ubuntu
            node: '24'
          - os: ubuntu-latest
            platform: Ubuntu
            node: '26'
          # Additionally verify the active LTS release on the other major operating systems.
          - os: macos-latest
            platform: macOS
            node: '24'
          - os: windows-latest
            platform: Windows
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # pnpm 11 requires Node >= 22.13, but `engines.node` is >= 22.12 and this matrix
      # deliberately tests that floor. Install under a Node that pnpm can run on, then
      # switch to the matrix version and run the suite without going through pnpm. What
      # we are testing is that the library works on the minimum Node, not that pnpm does.
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree.
      # `--mode virtual` reads the lockfile through arborist, which only
      # understands package-lock.json, so use `--mode actual` and walk the
      # installed tree instead. `--mode ideal` would ignore `--no-dev` and
      # still surface engines conflicts from dev-only deps (e.g. vitest).
      - run: pnpm exec ls-engines --mode actual --no-dev
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests on Node ${{ matrix.node }}
        run: npx vitest run

  vercel-edge:
    name: 'Test: Vercel Edge'
    # No `needs: [build]`: this job resolves `@sanity/client` through `sourceAlias`
    # (see `vitest.vercel-edge.config.ts`), so it never touches `dist/` and gains
    # nothing from waiting on, or restoring the artifact from, the `build` job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:vercel-edge

  # This job is why `eventsource` is pinned to >= 5.1.0. workerd's native `MessageEvent`
  # drops members of its constructor init dict, including `lastEventId`, which every
  # other environment this suite runs in honours. `src/data/eventsource.ts` reads
  # `message.lastEventId` to populate the `id` of every `ServerSentEvent`, so before
  # eventsource 5.1.0 that id arrived empty on bare Cloudflare Workers. Do not relax the
  # `eventsource` floor without checking these tests still pass here.
  #
  # Upstream fix: https://github.com/cloudflare/workerd/pull/6995. Once that ships and
  # the floor can be lowered again, this job is the check that proves it.
  workerd-runtime:
    name: 'Test: workerd'
    # No `needs: [build]`: see the comment on `vercel-edge` above - same reasoning,
    # `vitest.workerd.config.ts` also resolves through `sourceAlias`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workerd

  browser-runtime:
    name: 'Test: Chrome, Firefox, WebKit'
    # No `needs: [build]`: see the comment on `vercel-edge` above - same reasoning,
    # `vitest.browser.config.ts` also resolves through `sourceAlias`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # No `--coverage`: this ran as `pnpm run test:browser -- --coverage`, which
      # pnpm forwards literally, so vitest received `--coverage` as a positional
      # argument and silently collected nothing. Passing it properly does not
      # work either - `@vitest/coverage-v8` refuses to run against more than one
      # `browser.instances` entry, and this config runs three. Browser coverage
      # would therefore mean a chromium-only run that largely duplicates what
      # the `coverage` job already reports, so this job just runs the tests.
      - run: pnpm run test:browser

  test-happy-dom:
    # No `needs: [build]`: `vitest.happy-dom.config.ts` resolves through `sourceAlias`,
    # same reasoning as `vercel-edge` above.
    name: 'Test: happy-dom, Node.js LTS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:happy-dom

  test-react-server:
    # No `needs: [build]`: `vitest.react-server.config.ts` resolves through
    # `sourceAlias`, same reasoning as `vercel-edge` above.
    name: 'Test: React Server Components'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:react-server

  deno-runtime:
    name: 'Test: Deno'
    # No `needs: [build]`: `vitest.deno.config.ts` resolves through `sourceAlias`, same
    # reasoning as `vercel-edge` above - this job never touches `dist/`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # This job needs a full install: `test:deno` now runs the full suite through
      # `npm:vitest` (not `deno test`), and vitest - like the rest of the suite's
      # devDependencies - is unavailable under `--prod`. Confirmed empirically: `pnpm
      # install --frozen-lockfile --prod --ignore-scripts` here fails immediately with
      # "Could not find vitest in a node_modules folder." This job (like `bun-runtime`
      # below) can therefore no longer use `--prod --ignore-scripts` to catch a
      # devDependency leaking into a published entry point either - that guard now
      # lives in `test/exports.test.ts` and `test/packaging/` (entry-point resolution)
      # and in `knip` (dependency classification) instead of in this job's install step.
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - run: pnpm run test:deno

  bun-runtime:
    name: 'Test: Bun'
    # No `needs: [build]`: the default `vitest.config.ts` this job runs against also
    # resolves through `sourceAlias`, same reasoning as `vercel-edge` above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # This job runs the full suite (`pnpm run test:bun`) rather than the old
      # two-line smoke file, so it needs devDependencies (vitest itself included) and
      # can no longer install with `--prod --ignore-scripts` to catch a devDependency
      # leaking into a published entry point. That guard now lives in
      # `test/exports.test.ts` and `test/packaging/` (entry-point resolution) and in
      # `knip` (dependency classification) instead of in this job's install step.
      - run: pnpm install --frozen-lockfile
      - uses: antongolub/action-setup-bun@f0b9f339a7ce9ba1174a58484e4dc9bbd6f7b133 # v1
      - run: pnpm run test:bun

  # Repurposed from the former `node-runtimes` placeholder (test-suite-cleanup Task 13):
  # that job's `runtimes/node` tree is gone (Task 12), and the CJS interop guard it ran
  # now lives at `test/packaging/cjs-interop.test.ts`, alongside the `dist/` graph guard
  # (`test/packaging/distGraph.test.ts`). Both need a real build, not `dist/` aliased to
  # source, so this job builds fresh rather than restoring the `build` job's artifact.
  test-packaging:
    name: 'Test: Packaging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:packaging

  next-runtime:
    name: 'Typecheck: Next.js App Router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:next
