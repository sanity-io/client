name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main, v7]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree.
      # `--mode virtual` reads the lockfile through arborist, which only
      # understands package-lock.json, so use `--mode actual` and walk the
      # installed tree instead. `--mode ideal` would ignore `--no-dev` and
      # still surface engines conflicts from dev-only deps (e.g. vitest).
      - run: pnpm exec ls-engines --mode actual --no-dev
      - run: pnpm run prepublishOnly
      - run: pnpm run lint --report-unused-disable-directives
      - uses: actions/upload-artifact@v7
        name: Cache build output
        with:
          retention-days: 1
          name: build-output-${{ github.run_id }}
          path: |
            dist/

  coverage:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Test and report coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run coverage
      - uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        if: always()

  test:
    needs: [build, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the testing suite on each major OS with the latest LTS release of Node.js
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [lts/*]
        # It makes sense to also test the oldest, and latest, versions of Node.js, on ubuntu-only since it's the fastest CI runner
        include:
          - os: ubuntu-latest
            # Also test the minimum supported Node.js version (see `engines`).
            # Must not drop below the floor (`lts/-1` resolves to Node 20).
            node: 22.12.0
          # @TODO re-enable after the nightly builds work with vitest once again
          # - os: ubuntu-latest
          #   # Test the actively developed version that will become the latest LTS release next October
          #   node: current
        # The `build` job already runs the testing suite in ubuntu and lts/*
        exclude:
          - os: ubuntu-latest
            node: lts/*
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # pnpm 11 requires Node >= 22.13, but `engines.node` is >= 22.12 and this matrix
      # deliberately tests that floor. Install under a Node that pnpm can run on, then
      # switch to the matrix version and run the suite without going through pnpm. What
      # we are testing is that the library works on the minimum Node, not that pnpm does.
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree.
      # `--mode virtual` reads the lockfile through arborist, which only
      # understands package-lock.json, so use `--mode actual` and walk the
      # installed tree instead. `--mode ideal` would ignore `--no-dev` and
      # still surface engines conflicts from dev-only deps (e.g. vitest).
      - run: pnpm exec ls-engines --mode actual --no-dev
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests on Node ${{ matrix.node }}
        run: npx vitest run

  vercel-edge:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: pnpm run test:vercel-edge --retry=30

  workerd-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: pnpm run test:workerd --retry=30

  browser-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: pnpm run test:browser

  deno-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # Unlike the bun and node runtime jobs, this one needs a full install: `deno test`
      # type-checks the suite and resolves `@types/node`, which is a devDependency.
      # npm's flat node_modules happened to expose it even under `--omit=dev`; pnpm's
      # isolated layout does not.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm run test:deno

  bun-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # Production dependencies only, so that a devDependency leaking into the
      # published entry points fails here instead of in consumers' projects.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - uses: antongolub/action-setup-bun@f0b9f339a7ce9ba1174a58484e4dc9bbd6f7b133 # v1
      - run: pnpm run test:bun

  node-runtimes:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      # Production dependencies only, so that a devDependency leaking into the
      # published entry points fails here instead of in consumers' projects.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: pnpm run test:node-runtimes

  next-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:next
