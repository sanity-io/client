name: CI

on:
  merge_group:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # for checkout

jobs:
  build:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree:
      # `--mode virtual` (the lockfile) prunes dev deps properly, while
      # `--mode ideal` (package.json) ignores `--no-dev` and still surfaces
      # engines conflicts from dev-only deps (e.g. vitest).
      - run: npx ls-engines --mode virtual --no-dev
      - run: npm run prepublishOnly
      - run: npm run lint -- --report-unused-disable-directives
      - uses: actions/upload-artifact@v7
        name: Cache build output
        with:
          retention-days: 1
          name: build-output-${{ github.run_id }}
          path: |
            dist/

  coverage:
    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write
    name: Test and report coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - run: npm ci
      - run: npm run coverage
      - uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2
        if: always()

  test:
    needs: [build, coverage]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run the testing suite on each major OS with the latest LTS release of Node.js
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [lts/*]
        # It makes sense to also test the oldest, and latest, versions of Node.js, on ubuntu-only since it's the fastest CI runner
        include:
          - os: ubuntu-latest
            # Also test the minimum supported Node.js version (see `engines`).
            # Must not drop below the floor (`lts/-1` resolves to Node 20).
            node: 22.12.0
          # @TODO re-enable after the nightly builds work with vitest once again
          # - os: ubuntu-latest
          #   # Test the actively developed version that will become the latest LTS release next October
          #   node: current
        # The `build` job already runs the testing suite in ubuntu and lts/*
        exclude:
          - os: ubuntu-latest
            node: lts/*
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ matrix.node }}
      - run: npm install
      # Dev-only deps don't constrain published consumers, so exclude them
      # with `--no-dev`. That flag is only honored when walking a real tree:
      # `--mode virtual` (the lockfile) prunes dev deps properly, while
      # `--mode ideal` (package.json) ignores `--no-dev` and still surfaces
      # engines conflicts from dev-only deps (e.g. vitest).
      - run: npx ls-engines --mode virtual --no-dev
      - run: npm test

  prod-deps:
    name: Cache production dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: prod-deps
        uses: actions/cache@v6
        with:
          path: ./node_modules
          key: prod-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.prod-deps.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: steps.prod-deps.outputs.cache-hit != 'true'
        run: npm install --omit=dev --ignore-scripts

  vercel-edge:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - run: npm install
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: npm run test:vercel-edge -- --retry=30

  workerd-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - run: npm install
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: npm run test:workerd -- --retry=30

  browser-runtime:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - run: npm install
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: npm run test:browser

  deno-runtime:
    runs-on: ubuntu-latest
    needs: [build, prod-deps]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Install only production dependencies
        with:
          path: ./node_modules
          key: prod-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:deno

  bun-runtime:
    runs-on: ubuntu-latest
    needs: [build, prod-deps]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Install only production dependencies
        with:
          path: ./node_modules
          key: prod-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - uses: antongolub/action-setup-bun@f0b9f339a7ce9ba1174a58484e4dc9bbd6f7b133 # v1
      - run: npm run test:bun

  node-runtimes:
    runs-on: ubuntu-latest
    needs: [build, prod-deps]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        name: Install only production dependencies
        with:
          path: ./node_modules
          key: prod-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        name: Restore build output
        with:
          name: build-output-${{ github.run_id }}
          # The archive is rooted at `dist/` (`upload-artifact` strips the least
          # common ancestor of its paths), so extract it back into place.
          path: dist/
      - run: npm run test:node-runtimes

  next-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - run: npm install
      - run: npm run test:next
